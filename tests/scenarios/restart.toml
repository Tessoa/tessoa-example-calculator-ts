name = "Shows the same expression after tessoa restarts"

[[steps]]
open-page = "calculator"

[[steps]]
click = "k4"

[[steps]]
click = "k2"

[[steps]]
click = "add"

[[steps]]
click = "open"
expect-text = { key = "expression", text = "42 + (" }

[[steps]]
restart = true
expect-text = [{ key = "display", text = "42" }, { key = "expression", text = "42 + (" }]

[[steps]]
click = "k8"

[[steps]]
click = "eq"
expect-text = [{ key = "display", text = "50" }, { key = "expression", text = "42 + (8) =" }]
