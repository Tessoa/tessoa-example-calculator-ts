name = "Backspace takes the last digit, operator or bracket back, Escape clears"

[[steps]]
open-page = "calculator"

[[steps]]
key = "9"

[[steps]]
key = "8"
expect-text = { key = "display", text = "98" }

[[steps]]
key = "Backspace"
expect-text = { key = "display", text = "9" }

[[steps]]
key = "Backspace"
expect-text = [{ key = "display", text = "0" }, { key = "expression", text = "" }]

[[steps]]
click = "k7"

[[steps]]
click = "sub"

[[steps]]
click = "open"
expect-text = { key = "expression", text = "7 − (" }

[[steps]]
key = "Backspace"
expect-text = { key = "expression", text = "7 −" }

[[steps]]
key = "Backspace"
expect-text = { key = "expression", text = "7" }

[[steps]]
click = "add"
expect-text = { key = "expression", text = "7 +" }

[[steps]]
key = "Escape"
expect-text = [{ key = "display", text = "0" }, { key = "expression", text = "" }]

# The C button does what Escape does.
[[steps]]
click = "k4"

[[steps]]
click = "clear"
expect-text = [{ key = "display", text = "0" }, { key = "expression", text = "" }]
