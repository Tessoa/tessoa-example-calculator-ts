name = "Works out brackets first, by button and by key"

[[steps]]
open-page = "calculator"

[[steps]]
click = "open"

[[steps]]
click = "k2"

[[steps]]
click = "add"

[[steps]]
click = "k3"

[[steps]]
click = "close"

[[steps]]
click = "mul"

[[steps]]
click = "k4"
expect-text = { key = "expression", text = "(2 + 3) × 4" }

[[steps]]
click = "eq"
expect-text = { key = "display", text = "20" }

# Brackets inside brackets, typed.
[[steps]]
key = "("

[[steps]]
key = "1"

[[steps]]
key = "+"

[[steps]]
key = "("

[[steps]]
key = "2"

[[steps]]
key = "*"

[[steps]]
key = "3"

[[steps]]
key = ")"

[[steps]]
key = ")"

[[steps]]
key = "/"

[[steps]]
key = "2"
expect-text = { key = "expression", text = "(1 + (2 × 3)) ÷ 2" }

[[steps]]
key = "Enter"
expect-text = { key = "display", text = "3.5" }

# A bracket next to a number multiplies, and the × shows.
[[steps]]
key = "2"

[[steps]]
key = "("

[[steps]]
key = "3"

[[steps]]
key = ")"

[[steps]]
key = "4"
expect-text = { key = "expression", text = "2 × (3) × 4" }

[[steps]]
key = "Enter"
expect-text = { key = "display", text = "24" }
