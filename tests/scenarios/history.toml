name = "Keeps each result in the history, newest first, and starts again from a result clicked"

[[steps]]
open-page = "calculator"

[[steps]]
click = "toggle-history"
expect-text = { key = "history-empty", text = "No calculations yet" }

[[steps]]
click = "k2"

[[steps]]
click = "add"

[[steps]]
click = "k3"

[[steps]]
click = "eq"
expect-children = [{ key = "history", keys = ["h1"] }, { key = "h1", keys = ["h1-expr", "h1-value"] }]
expect-text = [{ key = "h1-expr", text = "2 + 3" }, { key = "h1-value", text = "= 5" }]
expect-tree-contains = [{ key = "history-empty", count = 0 }, { key = "clear-history", disabled = false }]

[[steps]]
key = "6"

[[steps]]
key = "*"

[[steps]]
key = "7"

[[steps]]
key = "Enter"
expect-text = [{ key = "h2-expr", text = "6 × 7" }, { key = "h2-value", text = "= 42" }]
expect-children = { key = "history", keys = ["h2", "h1"] }

# A lone number is not worth an entry.
[[steps]]
key = "9"

[[steps]]
key = "="
expect-children = { key = "history", keys = ["h2", "h1"] }

# A click on a result shows it, whatever was being typed.
[[steps]]
key = "4"

[[steps]]
key = "+"

[[steps]]
click = "h1-value"
expect-text = [{ key = "display", text = "5" }, { key = "expression", text = "2 + 3 =" }]

# The next operator goes on from it.
[[steps]]
click = "mul"
expect-text = { key = "expression", text = "5 ×" }

[[steps]]
click = "k2"

[[steps]]
click = "eq"
expect-text = { key = "display", text = "10" }
expect-children = { key = "history", keys = ["h3", "h2", "h1"] }

# A digit after a clicked result starts a new expression.
[[steps]]
click = "h2-value"
expect-text = { key = "display", text = "42" }

[[steps]]
click = "k1"
expect-text = [{ key = "display", text = "1" }, { key = "expression", text = "1" }]
