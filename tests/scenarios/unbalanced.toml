name = "Shows Error for a bracket that closes nothing and for an incomplete expression"

[[steps]]
open-page = "calculator"

[[steps]]
click = "k2"

[[steps]]
click = "add"

[[steps]]
click = "k3"

[[steps]]
click = "close"
expect-text = { key = "expression", text = "2 + 3)" }

[[steps]]
click = "eq"
expect-text = [{ key = "display", text = "Error" }, { key = "expression", text = "2 + 3) =" }]

# Empty brackets.
[[steps]]
click = "open"

[[steps]]
click = "close"

[[steps]]
click = "eq"
expect-text = [{ key = "display", text = "Error" }, { key = "expression", text = "() =" }]

# An operator with nothing after it.
[[steps]]
key = "7"

[[steps]]
key = "*"

[[steps]]
key = "Enter"
expect-text = [{ key = "display", text = "Error" }, { key = "expression", text = "7 × =" }]

# An error is not kept in the history.
[[steps]]
key = "1"
expect-text = { key = "last", text = "" }
